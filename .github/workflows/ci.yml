name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 构建 native shims（CMake，验证三平台可编译）
        run: |
          cmake -S native -B native/build
          cmake --build native/build --config Release

      - name: 构建 Release
        run: dotnet build -c Release

      - name: 构建 Debug（RT_ASSERT）
        run: dotnet build -c Debug

      - name: 测试 Release
        shell: bash
        run: |
          set +e
          dotnet test -c Release --no-build --logger "console;verbosity=detailed" 2>&1 | tee test-release.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            grep -E "失败|Failed" test-release.log | grep -v "已通过\|Passed" | head -40 | while read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: 测试 Debug（分配断言生效）
        shell: bash
        run: |
          set +e
          dotnet test -c Debug --no-build --logger "console;verbosity=detailed" 2>&1 | tee test-debug.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            grep -E "失败|Failed" test-debug.log | grep -v "已通过\|Passed" | head -40 | while read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: CLI 冒烟（headless 渲染 1s WAV）
        run: >-
          dotnet run --project tools/HeadlessRender -c Release --no-build --
          render --seconds 1 --out artifacts/m0-smoke.wav

      - name: 全链冒烟（demo 工程渲染）
        run: |
          dotnet run --project tools/HeadlessRender -c Release --no-build -- demo --out artifacts/demo.weft
          dotnet run --project tools/HeadlessRender -c Release --no-build -- project render artifacts/demo.weft --out artifacts/demo-render.wav

      - name: 校验 WAV 尺寸
        shell: bash
        run: |
          size=$(wc -c < artifacts/m0-smoke.wav)
          expected=384044
          if [ "$size" -ne "$expected" ]; then
            echo "WAV 尺寸异常: $size != $expected (44 + 48000*1*2*4)"
            exit 1
          fi
          [ -s artifacts/demo-render.wav ] || { echo "demo 渲染为空"; exit 1; }
